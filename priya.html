<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Happy Birthday - Interactive 3D Cube</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }
        
        .greeting-text {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0,0,0,0.5), 2px 2px 4px rgba(0,0,0,0.3);
            z-index: 100;
            pointer-events: none;
            background: linear-gradient(135deg, #FFD89B, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: none;
            font-weight: 800;
            letter-spacing: 2px;
        }
        
        .instruction {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            color: #ffecb3;
            font-size: 0.75rem;
            z-index: 100;
            pointer-events: none;
            font-family: monospace;
        }
        
        @media (max-width: 700px) {
            .greeting-text { font-size: 1.2rem; top: 12px; }
        }
        
        .audio-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
            color: #ffecb3;
            font-size: 0.8rem;
            z-index: 100;
            pointer-events: auto;
            font-family: monospace;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .audio-status:hover {
            background: rgba(0,0,0,0.9);
            transform: scale(1.05);
        }
        
        .play-button {
            position: fixed;
            bottom: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ff6b3d, #ff3d00);
            border: none;
            padding: 16px 40px;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            z-index: 200;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        
        .play-button:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="greeting-text">🎂 HAPPY BIRTHDAY! 🎈</div>
    <div class="instruction">✨ Drag to rotate the cube | Inside view | Auto-rotate when idle ✨</div>
    <div class="audio-status" id="audioStatus">🔊 Click to play your music</div>
    <button id="playBtn" class="play-button">🎵 PLAY MUSIC 🎵</button>
    
    <!-- Audio element for your song - CHANGE THE SRC TO YOUR SONG FILE -->
    <audio id="custom-audio" preload="auto" loop>
        <source src="tum.mp3" type="audio/mpeg">
        <!-- If tum.mp3 doesn't work, try uncommenting this line and put the full path -->
        <!-- <source src="./tum.mp3" type="audio/mpeg"> -->
    </audio>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- setup scene, camera inside the cube ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0.1);
        camera.lookAt(0, 0, 1);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        // --- Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.rotateSpeed = 1.2;
        controls.target.set(0, 0, 0);
        controls.update();
        
        // --- AUTO-ROTATION LOGIC
        let idleTimer = null;
        
        function startIdleTimer() {
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                if (!controls.autoRotate) {
                    controls.autoRotate = true;
                }
            }, 2000);
        }
        
        function onUserInteraction() {
            if (controls.autoRotate) {
                controls.autoRotate = false;
            }
            startIdleTimer();
        }
        
        controls.addEventListener('start', onUserInteraction);
        renderer.domElement.addEventListener('mousedown', onUserInteraction);
        renderer.domElement.addEventListener('touchstart', onUserInteraction);
        
        controls.autoRotate = false;
        controls.autoRotateSpeed = 1.5;
        startIdleTimer();
        
        // --- Lighting
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffaa66, 1.2, 15);
        pointLight.position.set(2, 3, 2);
        scene.add(pointLight);
        const backLight = new THREE.PointLight(0xff8866, 0.6);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);
        const fillLight = new THREE.DirectionalLight(0xffccaa, 0.8);
        fillLight.position.set(1, 2, 1);
        scene.add(fillLight);
        
        // --- Create the INNER CUBE
        const imageUrls = [
            "2.jpg",   // Front (+Z)
            "3.jpg",   // Back (-Z)
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgJ2KoXaSvHfqvXPv4ARq2AeClMLraNixo2N2XFZwrN5SKYayHKN5oDN-h&s=10",   // top
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQuL98TX2r2tzMbQZrLY36K8UrrthW4aeolM2hzVDcXWZCyIO8z3VxG7LNX&s=10",   // bottom
            "4.jpg",   // Up (+Y)
            "1.jpg"    // front
        ];
        
        const textureLoader = new THREE.TextureLoader();
        
        function createWallMaterial(url) {
            const texture = textureLoader.load(url);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.minFilter = THREE.LinearFilter;
            return new THREE.MeshStandardMaterial({
                map: texture,
                side: THREE.BackSide,
                roughness: 0.3,
                metalness: 0.05,
                emissive: 0x221100,
                emissiveIntensity: 0.15
            });
        }
        
        const cubeMaterials = imageUrls.map(url => createWallMaterial(url));
        const cubeGeometry = new THREE.BoxGeometry(8, 8, 8);
        const innerCube = new THREE.Mesh(cubeGeometry, cubeMaterials);
        scene.add(innerCube);
        
        // --- Floating particles
        const particleCount = 500;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 14;
            particlePositions[i*3+1] = (Math.random() - 0.5) * 7 + 0.5;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 14;
        }
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMaterial = new THREE.PointsMaterial({ color: 0xffaa66, size: 0.08, transparent: true, opacity: 0.6 });
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);
        
        // --- MUSIC PLAYBACK for tum.mp3
        const audioElement = document.getElementById('custom-audio');
        const playButton = document.getElementById('playBtn');
        const statusDiv = document.getElementById('audioStatus');
        let isPlaying = false;
        
        // Function to play music
        function playMusic() {
            if (isPlaying) return;
            
            audioElement.volume = 0.7;
            
            const playPromise = audioElement.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    statusDiv.innerHTML = '🎵 Music is playing! 🎂';
                    statusDiv.style.background = 'rgba(0,100,0,0.8)';
                    playButton.classList.add('hidden');
                    setTimeout(() => {
                        statusDiv.style.opacity = '0.7';
                    }, 2000);
                    console.log("✅ tum.mp3 is playing!");
                }).catch(error => {
                    console.error("Playback error:", error);
                    statusDiv.innerHTML = '❌ Error: Cannot find tum.mp3 file';
                    statusDiv.style.background = 'rgba(255,0,0,0.8)';
                });
            }
        }
        
        // Play button click handler
        playButton.addEventListener('click', playMusic);
        
        // Also play when user drags the cube (natural interaction)
        renderer.domElement.addEventListener('mousedown', () => {
            if (!isPlaying) playMusic();
        });
        renderer.domElement.addEventListener('touchstart', () => {
            if (!isPlaying) playMusic();
        });
        
        // Click on status bar also plays
        statusDiv.addEventListener('click', () => {
            if (!isPlaying) playMusic();
        });
        
        // Check if audio file exists and can be loaded
        audioElement.addEventListener('canplaythrough', () => {
            console.log("Audio file loaded successfully!");
            statusDiv.innerHTML = '🎵 Click to play tum.mp3';
        });
        
        audioElement.addEventListener('error', (e) => {
            console.error("Audio loading error:", e);
            statusDiv.innerHTML = '⚠️ Cannot find tum.mp3 - put the file in same folder';
            statusDiv.style.background = 'rgba(255,0,0,0.8)';
        });
        
        // --- particle animation
        function animateParticles() {
            particles.rotation.y += 0.002;
            particles.rotation.x += 0.001;
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
        
        // --- Main animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        
        // --- Subtle ambient glow particles at center
        const centerGlowGeo = new THREE.BufferGeometry();
        const glowCount = 200;
        const glowPositions = [];
        for (let i = 0; i < glowCount; i++) {
            const radius = 1.2;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.sin(phi) * Math.sin(theta);
            const z = radius * Math.cos(phi);
            glowPositions.push(x, y, z);
        }
        centerGlowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(glowPositions), 3));
        const glowMat = new THREE.PointsMaterial({ color: 0xffaa77, size: 0.05, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
        const centerGlow = new THREE.Points(centerGlowGeo, glowMat);
        scene.add(centerGlow);
        
        function animateCenterGlow() {
            requestAnimationFrame(animateCenterGlow);
            centerGlow.rotation.y += 0.005;
            centerGlow.rotation.x += 0.003;
        }
        animateCenterGlow();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log("%c🎵 Ready! Place 'tum.mp3' in the same folder as this HTML file 🎵", "color: orange; font-size: 16px");
    </script>
</body>
</html>
