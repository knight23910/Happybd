<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Happy Birthday - Interactive 3D Cube</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }
        
        .greeting-text {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0,0,0,0.5), 2px 2px 4px rgba(0,0,0,0.3);
            z-index: 100;
            pointer-events: none;
            background: linear-gradient(135deg, #FFD89B, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: none;
            font-weight: 800;
            letter-spacing: 2px;
        }
        
        .instruction {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            color: #ffecb3;
            font-size: 0.75rem;
            z-index: 100;
            pointer-events: none;
            font-family: monospace;
        }
        
        @media (max-width: 700px) {
            .greeting-text { font-size: 1.2rem; top: 12px; }
        }
        
        /* Simple loading indicator for audio */
        .audio-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 20px;
            color: #ffecb3;
            font-size: 0.7rem;
            z-index: 100;
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="greeting-text">🎂 HAPPY BIRTHDAY! 🎈</div>
    <div class="instruction">✨ Drag to rotate the cube | Inside view | Auto-rotate when idle ✨</div>
    <div class="audio-status" id="audioStatus">🎵 Loading birthday music...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- setup scene, camera inside the cube ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0.1);
        camera.lookAt(0, 0, 1);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        // --- Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.rotateSpeed = 1.2;
        controls.target.set(0, 0, 0);
        controls.update();
        
        // --- AUTO-ROTATION LOGIC
        let idleTimer = null;
        
        function startIdleTimer() {
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                if (!controls.autoRotate) {
                    controls.autoRotate = true;
                }
            }, 2000);
        }
        
        function onUserInteraction() {
            if (controls.autoRotate) {
                controls.autoRotate = false;
            }
            startIdleTimer();
        }
        
        controls.addEventListener('start', onUserInteraction);
        renderer.domElement.addEventListener('mousedown', onUserInteraction);
        renderer.domElement.addEventListener('touchstart', onUserInteraction);
        
        controls.autoRotate = false;
        controls.autoRotateSpeed = 1.5;
        startIdleTimer();
        
        // --- Lighting (enhanced slightly for better visuals)
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffaa66, 1.2, 15);
        pointLight.position.set(2, 3, 2);
        scene.add(pointLight);
        const backLight = new THREE.PointLight(0xff8866, 0.6);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);
        const fillLight = new THREE.DirectionalLight(0xffccaa, 0.8);
        fillLight.position.set(1, 2, 1);
        scene.add(fillLight);
        
        // --- Create the INNER CUBE (exactly as original)
        const imageUrls = [
            "2.jpg",   // Front (+Z)
            "3.jpg",   // Back (-Z)
            "https://images-static.nykaa.com/media/catalog/product/2/a/2a88f2335J60A77RP_1.jpg?tr=w-500",   // top
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlbwBFEZIKnZTnrUstLWjy0aFuTvmpSslVWqGNHOtgO6HVbJtmjpvJBto&s=10",   // bottom
            "4.jpg",   // Up (+Y)
            "1.jpg"    // front
        ];
        
        const textureLoader = new THREE.TextureLoader();
        
        function createWallMaterial(url) {
            const texture = textureLoader.load(url);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.minFilter = THREE.LinearFilter;
            return new THREE.MeshStandardMaterial({
                map: texture,
                side: THREE.BackSide,
                roughness: 0.3,
                metalness: 0.05,
                emissive: 0x221100,
                emissiveIntensity: 0.15
            });
        }
        
        const cubeMaterials = imageUrls.map(url => createWallMaterial(url));
        const cubeGeometry = new THREE.BoxGeometry(8, 8, 8);
        const innerCube = new THREE.Mesh(cubeGeometry, cubeMaterials);
        scene.add(innerCube);
        
        // --- Floating particles (unchanged)
        const particleCount = 500;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 14;
            particlePositions[i*3+1] = (Math.random() - 0.5) * 7 + 0.5;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 14;
        }
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMaterial = new THREE.PointsMaterial({ color: 0xffaa66, size: 0.08, transparent: true, opacity: 0.6 });
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);
        
        // --- AUTOMATIC MUSIC PLAYBACK (no click required)
        // Modern browsers restrict autoplay, but we can trigger it on the first user interaction 
        // OR use a silent audio context workaround. To truly autoplay without any click,
        // we need to use WebAudio with a silent buffer that gets unlocked on page load.
        // However, the most reliable method is to use the Audio element and call play() 
        // immediately after page load. Many browsers will allow it if the user has interacted 
        // with the site before, but for first-time visitors, we'll use the WebAudio approach
        // to bypass restrictions by playing a silent sound first, then the real song.
        
        const SONG_URL = "happy birthday.mp3";
        let audio = null;
        let isAudioPlaying = false;
        let audioContext = null;
        
        function initAndPlayAudio() {
            try {
                // Create Audio element
                audio = new Audio(SONG_URL);
                audio.loop = false;
                audio.volume = 0.65;
                audio.preload = 'auto';
                
                // Method 1: Direct play attempt
                const playPromise = audio.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        document.getElementById('audioStatus').innerHTML = '🎵 Happy Birthday playing! 🎂';
                        setTimeout(() => {
                            const statusDiv = document.getElementById('audioStatus');
                            if (statusDiv) statusDiv.style.opacity = '0.5';
                        }, 3000);
                        console.log("✅ Music started automatically!");
                    }).catch(error => {
                        console.log("Direct autoplay blocked:", error);
                        // Fallback: Use WebAudio approach to unlock
                        unlockAudioWithWebAudio();
                    });
                }
            } catch(e) {
                console.log("Audio initialization error:", e);
                unlockAudioWithWebAudio();
            }
        }
        
        function unlockAudioWithWebAudio() {
            // Create a silent WebAudio context that can unlock audio on any user gesture
            // But we'll also try to play the song as soon as the page gets ANY user interaction
            // However, the requirement is "without any manual click" - but browsers block autoplay.
            // The only way to truly autoplay without ANY click is if the browser settings allow it,
            // or we embed a silent video. Since that's not guaranteed, we'll use a subtle approach:
            // We'll listen to the first 'touchstart' or 'mousedown' that naturally occurs when the user
            // interacts with the 3D cube (which they will to rotate it). This is the best compromise.
            // But to make it as automatic as possible, we'll also try to play on page load with a 
            // user-interaction simulation. However, we cannot simulate clicks due to security.
            // So we display a subtle message but the music will start on first drag/click anywhere.
            
            document.getElementById('audioStatus').innerHTML = '🎵 Tap/click anywhere or drag cube to start music 🎵';
            
            // Play on first user interaction with the page (any click or touch)
            const startMusicOnInteraction = async () => {
                if (audio && !isAudioPlaying) {
                    try {
                        await audio.play();
                        isAudioPlaying = true;
                        document.getElementById('audioStatus').innerHTML = '🎵 Happy Birthday playing! 🎂';
                        setTimeout(() => {
                            const statusDiv = document.getElementById('audioStatus');
                            if (statusDiv) statusDiv.style.opacity = '0.5';
                        }, 3000);
                        console.log("✅ Music started on user interaction");
                    } catch(e) {
                        console.log("Still blocked:", e);
                    }
                }
                // Remove listeners after successful play or after first attempt
                document.body.removeEventListener('click', startMusicOnInteraction);
                document.body.removeEventListener('touchstart', startMusicOnInteraction);
                renderer.domElement.removeEventListener('mousedown', startMusicOnInteraction);
            };
            
            document.body.addEventListener('click', startMusicOnInteraction);
            document.body.addEventListener('touchstart', startMusicOnInteraction);
            renderer.domElement.addEventListener('mousedown', startMusicOnInteraction);
        }
        
        // Also try to use the 'load' event to start immediately, but we already know it's blocked.
        // We'll add an additional method: use a silent audio context that gets resumed on page load
        // Some browsers allow this if the page is opened via a user gesture (like clicking a link).
        
        // Attempt to use WebAudio to pre-load and play
        function tryWebAudioAutoplay() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                // Create a silent buffer and play it to unlock
                const silentBuffer = audioContext.createBuffer(1, 1, 22050);
                const source = audioContext.createBufferSource();
                source.buffer = silentBuffer;
                source.connect(audioContext.destination);
                source.start();
                audioContext.resume().then(() => {
                    console.log("WebAudio context resumed, attempting to play music");
                    if (audio && !isAudioPlaying) {
                        audio.play().then(() => {
                            isAudioPlaying = true;
                            document.getElementById('audioStatus').innerHTML = '🎵 Happy Birthday playing! 🎂';
                        }).catch(e => console.log("Still needs interaction:", e));
                    }
                }).catch(e => console.log("WebAudio resume failed:", e));
            } catch(e) {
                console.log("WebAudio not supported");
            }
        }
        
        // Start the music automatically when window loads
        window.addEventListener('load', () => {
            initAndPlayAudio();
            // Also try WebAudio method as backup
            setTimeout(tryWebAudioAutoplay, 100);
        });
        
        // Extra fallback: if the user hasn't started music after 2 seconds, show a friendly reminder
        setTimeout(() => {
            if (!isAudioPlaying) {
                const statusDiv = document.getElementById('audioStatus');
                if (statusDiv && statusDiv.innerHTML.indexOf('playing') === -1) {
                    statusDiv.innerHTML = '🎵 Click anywhere or drag the cube to play birthday song 🎵';
                    statusDiv.style.background = 'rgba(0,0,0,0.7)';
                    statusDiv.style.padding = '6px 14px';
                    statusDiv.style.borderRadius = '30px';
                }
            }
        }, 2000);
        
        // --- particle animation
        function animateParticles() {
            particles.rotation.y += 0.002;
            particles.rotation.x += 0.001;
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
        
        // --- Main animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        
        // --- Subtle ambient glow particles at center (aesthetic)
        const centerGlowGeo = new THREE.BufferGeometry();
        const glowCount = 200;
        const glowPositions = [];
        for (let i = 0; i < glowCount; i++) {
            const radius = 1.2;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.sin(phi) * Math.sin(theta);
            const z = radius * Math.cos(phi);
            glowPositions.push(x, y, z);
        }
        centerGlowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(glowPositions), 3));
        const glowMat = new THREE.PointsMaterial({ color: 0xffaa77, size: 0.05, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
        const centerGlow = new THREE.Points(centerGlowGeo, glowMat);
        scene.add(centerGlow);
        
        function animateCenterGlow() {
            requestAnimationFrame(animateCenterGlow);
            centerGlow.rotation.y += 0.005;
            centerGlow.rotation.x += 0.003;
        }
        animateCenterGlow();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log("%c🎵 3D Cube Ready | Music will play automatically when possible (tap if needed) 🎵", "color: orange; font-size: 16px");
    </script>
</body>
</html>
